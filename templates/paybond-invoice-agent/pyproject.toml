[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paybond-invoice-agent"
version = "0.1.0"
description = "Invoice processing agent (Python LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "paybond-kit>=0.12.17",
    "langgraph>=1.2.0",
]

[project.scripts]
paybond-template-demo = "app:cli_main"

[tool.setuptools]
py-modules = ["app", "paybond_config"]
